# Publicar Delywa desde el celular: hace lo mismo que instalar-delywa.bat, pero en GitHub.
# En la app de GitHub: repositorio delywa → Actions → "Publicar Delywa" → Run workflow.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token de Cloudflare con permiso para Workers, D1, R2 y Queues
#   CLOUDFLARE_ACCOUNT_ID  el Account ID de tu cuenta de Cloudflare
name: Publicar Delywa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (main = la última; o una rama como v2.31.0)"
        required: true
        default: main
      publicar_aunque_fallen_pruebas:
        description: "Solo en una emergencia: publicar aunque falle alguna prueba"
        type: boolean
        default: false

concurrency:
  group: publicar-delywa
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Revisar que estén los secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Bajar la versión ${{ inputs.version }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Pruebas (si fallan, no se publica)
        continue-on-error: ${{ inputs.publicar_aunque_fallen_pruebas }}
        run: npx vitest run

      - name: Compilar y preparar Cloudflare
        run: npm run build

      - name: Aplicar migraciones de la base de datos (solo agregan, no borran)
        run: npx wrangler d1 migrations apply delywa-db --remote

      - name: Publicar en Cloudflare
        run: npx wrangler deploy

      - name: Resumen
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Delywa ${VERSION}"
            echo ""
            echo "- Rama: \`${{ inputs.version }}\`"
            echo "- Resultado: ${{ job.status }}"
            echo "- Revisa en delywa.com que abajo en el menú diga «Delywa versión ${VERSION}»."
          } >> "$GITHUB_STEP_SUMMARY"
